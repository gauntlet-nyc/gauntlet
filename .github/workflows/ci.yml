name: Scaffold validation
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --frozen
      - run: uv run ruff check services/gauntlet scripts
      - run: uv run pytest -q
      - run: uv run python scripts/export_schemas.py
      - run: git diff --exit-code packages/contracts/jsonschema
  python-full:
    # Whole-source lint and type check, with the optional live-provider SDKs installed
    # so their adapters type-check. No keys and no live calls.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --frozen --group live-providers
      - run: uv run --frozen ruff check services/gauntlet scripts
      - run: uv run --frozen mypy services/gauntlet/src
      - run: uv run --frozen pytest -q
  python-macos:
    # The demo laptop is a Mac. Required: the refund harness now resolves node from PATH.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gauntlet/dashboard typecheck
      - run: pnpm --filter @gauntlet/dashboard lint
      - run: pnpm --filter @gauntlet/dashboard test
      - run: pnpm --filter @gauntlet/dashboard build
