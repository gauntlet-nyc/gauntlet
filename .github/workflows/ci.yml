name: Scaffold validation
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pydantic>=2.9' 'fastapi>=0.115' 'httpx>=0.27' 'pytest>=8'
      - run: python -m pip install 'ruff>=0.7' 'mypy>=1.12'
      - run: ruff check services/gauntlet/src/gauntlet/api services/gauntlet/tests/test_api.py
      - run: mypy services/gauntlet/src/gauntlet/api
      - run: PYTHONPATH=services/gauntlet/src python -m pytest -q services/gauntlet/tests
      - run: PYTHONPATH=services/gauntlet/src python scripts/export_schemas.py
      - run: git diff --exit-code packages/contracts/jsonschema
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gauntlet/dashboard typecheck
      - run: pnpm --filter @gauntlet/dashboard lint
      - run: pnpm --filter @gauntlet/dashboard test
      - run: pnpm --filter @gauntlet/dashboard build
