name: Scaffold validation
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pydantic>=2.9' 'fastapi>=0.115' 'httpx>=0.27' 'pytest>=8'
      - run: PYTHONPATH=services/gauntlet/src python -m pytest -q services/gauntlet/tests
      - run: PYTHONPATH=services/gauntlet/src python scripts/export_schemas.py
      - run: git diff --exit-code packages/contracts/jsonschema
