name: Scaffold validation
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run ruff check services/gauntlet/src/gauntlet/api services/gauntlet/tests/test_api.py
      - run: uv run mypy services/gauntlet/src/gauntlet/api
      - run: uv run pytest -q
      - run: uv run python scripts/export_schemas.py
      - run: git diff --exit-code packages/contracts/jsonschema
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gauntlet/dashboard typecheck
      - run: pnpm --filter @gauntlet/dashboard lint
      - run: pnpm --filter @gauntlet/dashboard test
      - run: pnpm --filter @gauntlet/dashboard build
