[project]
name = "gauntlet-workspace"
version = "0.1.0"
description = "Gauntlet v3 development workspace (not a production-ready service)"
requires-python = ">=3.12"
dependencies = ["gauntlet-control"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.12",
    "jsonschema>=4.20",
    "uvicorn>=0.54.0",
]

[tool.uv.workspace]
members = ["services/gauntlet"]

[tool.uv.sources]
gauntlet-control = { workspace = true }

[tool.ruff]
line-length = 100
src = ["services/gauntlet/src"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "services/gauntlet/src"

[tool.pytest.ini_options]
testpaths = ["services/gauntlet/tests"]
pythonpath = ["services/gauntlet/src"]
